name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor and the Supabase library (bundled so the app has no CDN dependency)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @supabase/supabase-js@2.45.4

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html app.js style.css sw.js manifest.webmanifest icon-192.png icon-512.png www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#supabase.js#' www/index.html
          grep -q 'src="supabase.js"' www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.collins.propertymanager",
            "appName": "Property Manager",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PropertyManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PropertyManager-apk
          path: PropertyManager.apk

      - name: Publish a downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest PropertyManager.apk \
            --title "Property Manager (Android APK)" \
            --notes "Download PropertyManager.apk on your Android phone and install it. Built from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
